name: Build Push Deploy Flask to ACR and VM

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: flask-app
  IMAGE_TAG: ${{ github.sha }}
  COMPOSE_PROJECT: flaskapp
  ARM_USE_OIDC: true

jobs:
  azure-login:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login.outputs.registry }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }} # Add this secret if needed for other ops
      - name: ACR Login
        id: login
        run: |
          echo "Logging into ACR via OIDC..."
          az acr login --name ${{ secrets.ACR_NAME }}

  build-push:
    needs: azure-login
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (for ACR)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name ${{ secrets.ACR_NAME }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  deploy-vm:
    needs: build-push
    runs-on: ubuntu-latest
    environment: development # Optional approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            cd ~/app
            az acr login --name ${{ secrets.ACR_NAME }}
            docker compose pull flask_app
            docker compose down
            docker compose up -d --force-recreate
            sleep 60
            curl -f http://localhost:5000/health
