services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flask_crud_db
    ports:
      - "5432:5432"  # Restrict in prod (e.g., remove or use 127.0.0.1:5432:5432)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d flask_crud_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  flask_app:
    image: ${FLASK_IMAGE}
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FLASK_ENV: production  # Changed from development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Removed volumes: .:/app to avoid host bind-mounts in prod

volumes:
  postgres_data:
    driver: local